name: Sta Quick APK

# 只出包，不跑测试与 lint。用来快速拿到可安装的 APK 验证功能，
# 单元测试与 lint 交给 Eta Build（android-release.yml）在后台慢慢跑。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: sta-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Release APK
        # 不做签名配置：Gradle 里 release 的 signingConfig 是 "release ?: debug"，
        # 没配正式证书时自动用 debug 证书，可直接覆盖安装。
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Peta.buildMetadata=${GITHUB_SHA::7} \
            :app:assembleRelease

      - name: 整理并校验 APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#apks[@]}）"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          apk="${apks[0]}"
          name="$(basename "$apk")"
          echo "=== $name ==="
          ls -la "$apk"
          md5sum "$apk" || true
          sha256sum "$apk" || true

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner_path" verify --min-sdk-version 34 "$apk" \
            && echo "签名校验通过"

          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sta-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
