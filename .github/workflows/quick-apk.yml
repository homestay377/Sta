name: Sta Quick APK

# 只出包，不跑测试与 lint。用来快速拿到可安装的 APK 验证功能，
# 单元测试与 lint 交给 Eta Build（android-release.yml）在后台慢慢跑。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: sta-quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Release + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Release 与 Debug APK
        # 不做签名配置：Gradle 里 release 的 signingConfig 会回退到 debug 证书，
        # 没配正式 Secrets 时也能直接覆盖安装。
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Peta.buildMetadata=${GITHUB_SHA::7} \
            :app:assembleRelease :app:assembleDebug

      - name: 整理并校验 APK
        id: apk
        run: |
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/release/Sta-v*.apk)
          debug_apks=(app/build/outputs/apk/debug/Sta-v*.apk)

          echo "Release 包数量: ${#release_apks[@]}"
          echo "Debug 包数量: ${#debug_apks[@]}"

          if [[ ${#release_apks[@]} -ne 1 ]]; then
            echo "::error::Release APK 数量异常（${#release_apks[@]}）"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          if [[ ${#debug_apks[@]} -ne 1 ]]; then
            echo "::error::Debug APK 数量异常（${#debug_apks[@]}）"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi

          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for apk in "${release_apks[0]}" "${debug_apks[0]}"; do
            echo "=== $(basename "$apk") ==="
            ls -la "$apk"
            md5sum "$apk"
            sha256sum "$apk"
            "$apksigner_path" verify --min-sdk-version 34 "$apk" \
              && echo "  ^ 签名校验通过"
          done

          echo "release=${release_apks[0]}" >> "$GITHUB_OUTPUT"
          echo "debug=${debug_apks[0]}" >> "$GITHUB_OUTPUT"

      # archive:false 时一次只能传一个文件，所以两个包分两步上传，
      # 这样在 Artifact 列表里能看到两个可单独下载的 APK。
      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sta-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.release }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sta-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.debug }}
          archive: false
          if-no-files-found: error
          retention-days: 14
